name: Deploy registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck dos componentes
        run: bun run typecheck
      - name: Build registry
        run: bun run registry:build
      - name: Conferir que todo item do registry.json saiu
        run: |
          test -f public/r/registry.json
          node -e '
            const fs = require("fs")
            const { items } = require("./registry.json")
            const nomes = items.map((i) => i.name)
            const faltou = nomes.filter((n) => !fs.existsSync(`public/r/${n}.json`))
            const sobrou = fs
              .readdirSync("public/r")
              .filter((f) => f.endsWith(".json") && f !== "registry.json")
              .map((f) => f.slice(0, -5))
              .filter((n) => !nomes.includes(n))
            if (faltou.length) console.error("faltou no build: " + faltou.join(", "))
            if (sobrou.length) console.error("sobrou de build antigo: " + sobrou.join(", "))
            if (faltou.length || sobrou.length) process.exit(1)
            console.log(`${nomes.length} itens conferidos, um por um`)
          '
          echo "itens gerados:"; ls -1 public/r
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
