name: Deploy registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build registry
        run: bun run registry:build
      - name: Conferir que os itens saíram
        run: |
          test -f public/r/registry.json
          for item in theme button badge switch checkbox progress sonner view-toggle row-actions task-table task-timeline kanban priority-flag i18n; do
            test -f "public/r/$item.json" || { echo "faltou $item.json"; exit 1; }
          done
          echo "itens gerados:"; ls -1 public/r
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
